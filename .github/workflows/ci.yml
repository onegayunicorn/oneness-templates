name: ONENESS CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace and all templates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run workspace tests
        run: pnpm test

      - name: Build workspace
        run: pnpm build

      - name: Verify every registered template has valid source files
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const root = resolve('.');
          const cli = readFileSync('packages/cli/src/index.ts', 'utf8');
          const entries = [...cli.matchAll(/name: '([^']+)',[\s\S]*?files: \[(.*?)\]/g)];
          if (entries.length !== 16) throw new Error(`Expected 16 registered templates, found ${entries.length}`);
          for (const [, name, files] of entries) {
            for (const match of files.matchAll(/'([^']+)'/g)) {
              const file = resolve(root, 'packages/core/src/templates', name, match[1]);
              if (!existsSync(file)) throw new Error(`Missing ${name}/${match[1]}`);
            }
          }
          console.log(`Verified ${entries.length} registered templates.`);
          NODE

      - name: Scaffold, typecheck, build, and test every template
        run: node scripts/ci-scaffold-all.mjs
